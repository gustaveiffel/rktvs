[package]
name = "rk-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cost-aware scheduling, estimation, and resumable fetching for rk"

[dependencies]
rk-core = { path = "../rk-core" }
rk-transport = { path = "../rk-transport" }
blake3 = "1.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
anyhow = "1.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.25"
