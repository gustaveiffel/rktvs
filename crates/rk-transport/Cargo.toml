[package]
name = "rk-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "QUIC transport layer for rk hub-satellite communication"

[dependencies]
rk-core = { path = "../rk-core" }
quinn = "0.11"
blake3 = "1.8"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util"] }
bytes = "1"
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
zstd = "0.13"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3.25"
