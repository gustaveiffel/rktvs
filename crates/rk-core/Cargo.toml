[package]
name = "rk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core library: chunk store, chunker, and SQLite catalog for rk"

[dependencies]
blake3 = "1.8"
fastcdc = "3.2"
rusqlite = { version = "0.38", features = ["bundled"] }
zstd = "0.13"
thiserror = "2.0"
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3.25"
rk-tar = { path = "../rk-tar" }
rk-scheduler = { path = "../rk-scheduler" }
tar = "0.4"
