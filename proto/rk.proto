syntax = "proto3";
package rk;

message Handshake {
  string satellite_id = 1;
  uint32 protocol_version = 2;
}

message HandshakeAck {
  bool ok = 1;
  string message = 2;
  uint32 protocol_version = 3;
}

message ChunkRequest {
  bytes hash = 1;
}

message ChunkResponse {
  bool found = 1;
  bytes data = 2;
  uint64 size = 3;
  bool compressed = 4;
}

message CatalogSyncRequest {
  string tape = 1;
}

message TapeInfo {
  string name = 1;
  uint64 file_count = 2;
  uint64 total_size = 3;
}

message ChunkInfo {
  bytes hash = 1;
  uint64 offset = 2;
  uint64 size = 3;
}

message FileMetadata {
  string path = 1;
  int64 entry_type = 2;
  uint64 size = 3;
  uint64 mtime = 4;
  uint32 mode = 5;
  uint64 version = 6;
  repeated ChunkInfo chunks = 7;
}

message CatalogSyncResponse {
  bool ok = 1;
  string message = 2;
  repeated TapeInfo tapes = 3;
  repeated FileMetadata files = 4;
}
